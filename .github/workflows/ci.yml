name: ci

# Application CI: backend, frontend and browser tests. No secrets, no id-token, no path filters:
# every PR (forks included) and every push to main runs all three jobs. See SystemTurn/docs/cicd.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SystemTurn/backend/turnos-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (2026-10-14)
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SystemTurn/backend/turnos-api/pom.xml
      # Docker is available on ubuntu runners; -DrequireDocker=true turns a skipped PostgreSQL test into a failure.
      - name: Backend tests (PostgreSQL included)
        run: ./mvnw -B -ntp test -DrequireDocker=true

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SystemTurn/frontend/frontend-react/react-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SystemTurn/frontend/frontend-react/react-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: SystemTurn/frontend/frontend-react/react-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false
      # Java 17 runs the backend that Playwright starts as its first webServer (./mvnw spring-boot:run on H2).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0 (2026-10-14)
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: SystemTurn/backend/turnos-api/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SystemTurn/frontend/frontend-react/react-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            SystemTurn/frontend/frontend-react/react-client/playwright-report/
            SystemTurn/frontend/frontend-react/react-client/test-results/
          if-no-files-found: ignore
          retention-days: 14
