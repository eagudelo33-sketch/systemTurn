server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:${TURNOS_DB_PATH:./data/turnos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
turnos:
  timezone: America/Bogota
  seed-file: classpath:turnos_hoy.csv
  allowed-origins: http://localhost:4200,http://localhost:5173,http://127.0.0.1:5173
