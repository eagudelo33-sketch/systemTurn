schema: spec-driven

context: |
  Project: systemturn (virtual queue: clients get tickets like T-011, advisors call next).
  Backend: Java 17, Spring Boot 4.1.2, Maven wrapper; hexagonal (domain/application/infrastructure/web); in-memory repo + CSV seed.
  Frontend: React 19, Vite 8, ESLint 10 (JavaScript, no TypeScript, Vitest (unit) + Playwright (e2e)).
  Testing: backend JUnit via spring-boot-starter-*-test; frontend Vitest (npm test), Playwright browser tests (npm run e2e), lint and build.
  Docs baseline: SystemTurn/docs (README.md = map, status, roadmap, decisions; app.md = application; infra-onboarding.md = AWS runbook).

strict_tdd: true

delivery:
  strategy: single-pr
  review_budget_lines: 800

testing:
  strict_tdd: true
  backend:
    path: backend/turnos-api
    runner: "./mvnw test"
    framework: JUnit 5 (Spring Boot test)
    layers:
      unit: true        # TurnoServiceTest
      integration: true # TurnoControllerTest (webmvc-test), TurnosApiApplicationTests
      e2e: false
    coverage: false     # no jacoco configured
  frontend:
    path: frontend/frontend-react/react-client
    runner: "npm test"  # Vitest 5, src/**/*.test.{js,jsx} (service layer; no component tests for the views)
    e2e:
      runner: "npm run e2e"   # Playwright Test 1.64.1, headless Chromium, e2e/*.spec.js (13 tests)
      path: e2e/
      install: "npm run e2e:install"   # first time only
      note: "boots backend (dev,demo, in-memory H2) + Vite itself; ports 8080/5173 must be free"
    lint: "npm run lint"
    build: "npm run build"
    coverage: false
  infra:
    path: infra
    runner: "terraform test (per root: bootstrap, envs/dev, envs/prod; mock_provider, no AWS credentials)"
    static_gates:
      - "terraform fmt -check -recursive"
      - "terraform validate (after init -backend=false)"
      - "tflint --config=.tflint.hcl --chdir=<root>"
      - "trivy config --config trivy.yaml SystemTurn/infra"
    check_script: "bash SystemTurn/infra/scripts/check-conventions.sh"
    coverage: false
  quality:
    linter: "npm run lint (frontend only)"
    type_checker: none
    formatter: none

rules:
  proposal:
    - Include rollback plan for risky changes
    - Reference the decisions and open gaps in docs/README.md when relevant
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Respect hexagonal layering; domain MUST NOT depend on infrastructure/web
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Forecast against the 800-line review budget (single-pr)
  apply:
    guidelines:
      - Follow existing code patterns
      - Backend work is test-first (RED-GREEN-REFACTOR) with JUnit
      - Frontend work is test-first with Vitest (unit) or Playwright (browser, npm run e2e)
    tdd: true
    test_command: "./mvnw test (from backend/turnos-api); npm test and npm run e2e (from react-client); infra: terraform test per root"
  verify:
    test_command: "./mvnw test (from backend/turnos-api); npm test and npm run e2e (from react-client); infra: terraform test per root + check-conventions.sh"
    build_command: "npm run build (from react-client); ./mvnw package (from backend/turnos-api); infra: terraform fmt -check, validate, tflint, trivy config"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
